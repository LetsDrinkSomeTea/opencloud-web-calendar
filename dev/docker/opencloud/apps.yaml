web-calendar:
  config:
    # All options are optional, see "Configuration" in README.md for details.
    caldavBasePath: /caldav
    locationSearch:
      enabled: true
      url: https://nominatim.openstreetmap.org/search
    defaultView: dayGridMonth # dayGridMonth | timeGridWeek | timeGridDay | listAgenda
    # firstDayOfWeek: 1 # 0 = Sunday … 6 = Saturday, unset = derived from the language
    # searchRangeMonths: 12 # months before/after the current date searched on the server, 0 = loaded events only
