      url: https://nominatim.openstreetmap.org/search
    defaultView: dayGridMonth # dayGridMonth | timeGridWeek | timeGridDay
    # firstDayOfWeek: 1 # 0 = Sunday … 6 = Saturday, unset = derived from the language
